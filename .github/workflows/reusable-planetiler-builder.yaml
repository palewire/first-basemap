name: Reusable Planetiler workflow

on:
  workflow_call:
    inputs:
      product:
        description: "The product we're building"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1

  # OIDC role used ONLY by controller jobs (ubuntu-latest)
  GITHUB_OIDC_ROLE_ARN: arn:aws:iam::743323791619:role/GitHub-OIDC-Role

  # Your EC2 runner role **and** instance profile
  EC2_ROLE_NAME: GitHub-EC2-Runner-Role

  # EC2 settings for the GitHub Actions runners
  AMI_ID: ami-0c7217cdde317cfec
  INSTANCE_TYPE: r5d.24xlarge
  VOLUME_SIZE: 1000
  SUBNET_ID: subnet-0ba0b0f9edf1c0634
  SG_ID: sg-0f07c5f76997741fa
  AAIID: a208509

  # Public S3 bucket for hosting the PMTiles
  AWS_ACCESS_KEY_ID: ${{ secrets.PUBLIC_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_AWS_SECRET_ACCESS_KEY }}
  AWS_REGION_NAME: ${{ secrets.PUBLIC_AWS_DEFAULT_REGION }}
  AWS_S3_BUCKET_NAME: ${{ secrets.PUBLIC_AWS_S3_BUCKET_NAME }}

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials (OIDC – controller only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_OIDC_ROLE_ARN }}
          role-session-name: start-ec2-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2.4.0
        with:
          mode: start
          github-token: ${{ secrets.RUNNER_MACHINE_TOKEN }}
          iam-role-name: ${{ env.EC2_ROLE_NAME }}
          ec2-image-id: ${{ env.AMI_ID }}
          ec2-instance-type: ${{ env.INSTANCE_TYPE }}
          ec2-volume-size: ${{ env.VOLUME_SIZE }}
          subnet-id: ${{ env.SUBNET_ID }}
          security-group-id: ${{ env.SG_ID }}
          aws-resource-tags: >
            [
              {"Key": "tr:application-asset-insight-id", "Value": "${{ env.AAIID }}"},
              {"Key": "tr:repo", "Value": "${{ github.repository }}"}
            ]
          pre-runner-script: |
            # Update system
            sudo dnf update -y

            # Install dependencies
            sudo dnf install -y docker git libicu htop iotop nvme-cli

            # Setup NVMe instance storage
            if lsblk | grep -q nvme1n1; then
              sudo mkfs.xfs /dev/nvme1n1
              sudo mkdir -p /mnt/planetiler
              sudo mount /dev/nvme1n1 /mnt/planetiler
              sudo chmod 777 /mnt/planetiler
            fi

            # Start Docker
            sudo systemctl enable docker
            sudo systemctl start docker

  generate-tiles:
    name: Generate tiles
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 240

    steps:
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            zip \
            unzip \
            curl \
            sqlite3 \
            gcc \
            build-essential \
            awscli \
            openjdk-21-jdk-headless

      - name: Install Docker
        run: |
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker

      - name: Setup working directory
        run: |
          # Use NVMe instance storage for best performance
          if [ -d "/mnt/planetiler" ]; then
            export WORK_DIR="/mnt/planetiler"
          else
            export WORK_DIR="$HOME/planetiler"
            mkdir -p $WORK_DIR
          fi

          echo "Using working directory: $WORK_DIR"
          cd $WORK_DIR
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV

      - name: Download Planetiler
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "Downloading latest Planetiler..."
          LATEST_URL=$(curl -s https://api.github.com/repos/onthegomap/planetiler/releases/latest \
            | grep browser_download_url | head -1 | grep -E "planetiler.jar" | cut -d '"' -f 4)

          echo "Download URL: $LATEST_URL"
          curl -L -o planetiler.jar "$LATEST_URL"

          # Verify download
          java -jar planetiler.jar --help > /dev/null
          echo "✓ Planetiler downloaded successfully"

      - name: Configure simplification parameters
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Set simplification parameters based on selected profile
          case "${{ inputs.product }}" in
            'buildings')
              echo "Using the default simplification profile for a building layer"
              SIMPLIFY_TOLERANCE="0.1"
              SIMPLIFY_TOLERANCE_MAX_ZOOM="0.0625"
              MIN_FEATURE_SIZE="1.0"
              MIN_FEATURE_SIZE_MAX_ZOOM="0.0625"
              ;;
            'base')
              echo "Using a more aggressive simplification profile for a base map layer without buildings"
              SIMPLIFY_TOLERANCE="0.4"
              SIMPLIFY_TOLERANCE_MAX_ZOOM="0.3"
              MIN_FEATURE_SIZE="1.5"
              MIN_FEATURE_SIZE_MAX_ZOOM="0.5"
              ;;
          esac

          # Export to GitHub environment for next steps
          echo "SIMPLIFY_TOLERANCE=$SIMPLIFY_TOLERANCE" >> $GITHUB_ENV
          echo "SIMPLIFY_TOLERANCE_MAX_ZOOM=$SIMPLIFY_TOLERANCE_MAX_ZOOM" >> $GITHUB_ENV
          echo "MIN_FEATURE_SIZE=$MIN_FEATURE_SIZE" >> $GITHUB_ENV
          echo "MIN_FEATURE_SIZE_MAX_ZOOM=$MIN_FEATURE_SIZE_MAX_ZOOM" >> $GITHUB_ENV

          # Display selected parameters
          echo ""
          echo "=== Simplification Parameters ==="
          echo "Product: ${{ inputs.product }}"
          echo "Simplify tolerance: $SIMPLIFY_TOLERANCE"
          echo "Simplify tolerance at max zoom: $SIMPLIFY_TOLERANCE_MAX_ZOOM"
          echo "Min feature size: $MIN_FEATURE_SIZE"
          echo "Min feature size at max zoom: $MIN_FEATURE_SIZE_MAX_ZOOM"
          echo "================================="

      - name: Configure zoom levels
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Set the zoom levels based on the product
          case "${{ inputs.product }}" in
            'buildings')
              echo "Using zoom levels 13-15 for the buildings layer"
              MIN_ZOOM=13
              MAX_ZOOM=15
              ;;
            'base')
              echo "Using zoom levels 0-15 for the base layer without buildings"
              MIN_ZOOM=0
              MAX_ZOOM=15
              ;;
          esac

          # Export to GitHub environment for next steps
          echo "MIN_ZOOM=$MIN_ZOOM" >> $GITHUB_ENV
          echo "MAX_ZOOM=$MAX_ZOOM" >> $GITHUB_ENV

          # Display selected zoom levels
          echo ""
          echo "=== Zoom Levels ==="
          echo "Min zoom: $MIN_ZOOM"
          echo "Max zoom: $MAX_ZOOM"
          echo "===================="

      - name: Generate planet tiles
        working-directory: ${{ env.WORK_DIR }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          OUTPUT_FILE="planet-${TIMESTAMP}-${{ inputs.product }}.pmtiles"

          # Build Planetiler command
          PLANETILER_CMD="java -Xmx650g -XX:MaxHeapFreeRatio=40 -jar planetiler.jar"

          # Configure data source
          PLANETILER_CMD="$PLANETILER_CMD --area=planet --bounds=world --download"
          PLANETILER_CMD="$PLANETILER_CMD --download-threads=10 --download-chunk-size-mb=1000"

          # Limit languages to English for smaller size
          PLANETILER_CMD="$PLANETILER_CMD --languages=en"

          # Add simplification parameters
          PLANETILER_CMD="$PLANETILER_CMD --simplify-tolerance=$SIMPLIFY_TOLERANCE"
          PLANETILER_CMD="$PLANETILER_CMD --simplify-tolerance-at-max-zoom=$SIMPLIFY_TOLERANCE_MAX_ZOOM"
          PLANETILER_CMD="$PLANETILER_CMD --min-feature-size=$MIN_FEATURE_SIZE"
          PLANETILER_CMD="$PLANETILER_CMD --min-feature-size-at-max-zoom=$MIN_FEATURE_SIZE_MAX_ZOOM"

          # Add remaining options
          PLANETILER_CMD="$PLANETILER_CMD --fetch-wikidata"
          PLANETILER_CMD="$PLANETILER_CMD --output=$OUTPUT_FILE"
          PLANETILER_CMD="$PLANETILER_CMD --nodemap-type=array"
          PLANETILER_CMD="$PLANETILER_CMD --storage=ram"
          PLANETILER_CMD="$PLANETILER_CMD --min-zoom=$MIN_ZOOM"
          PLANETILER_CMD="$PLANETILER_CMD --max-zoom=$MAX_ZOOM"

          # Skip building merge if requested
          if [ "${{ inputs.product }}" == "base" ]; then
            PLANETILER_CMD="$PLANETILER_CMD --building-merge-z13=false"
          fi

          # Set feature layers based on product
          if [ "${{ inputs.product }}" == "buildings" ]; then
            PLANETILER_CMD="$PLANETILER_CMD --only-layers=building"
          else
            PLANETILER_CMD="$PLANETILER_CMD --exclude-layers=housenumber,building,poi"
          fi

          echo ""
          echo "=== Starting Planetiler ==="
          echo "Command: $PLANETILER_CMD"
          echo "==========================="
          echo ""

          # Run Planetiler
          set +e  # Don't exit on error
          $PLANETILER_CMD 2>&1 | tee planetiler.log
          PLANETILER_EXIT=$?
          set -e

          # Check result
          if [ $PLANETILER_EXIT -eq 0 ] && [ -f "$OUTPUT_FILE" ]; then
            echo ""
            echo "✓ Planet tiles generated successfully!"
            echo "End time: $(date)"
            ls -lh "$OUTPUT_FILE"
            echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV
            echo "GENERATION_SUCCESS=true" >> $GITHUB_ENV
          else
            echo ""
            echo "✗ Planet tile generation failed! (exit code: $PLANETILER_EXIT)"
            echo "End time: $(date)"
            tail -100 planetiler.log
            echo "GENERATION_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload to S3 bucket
        if: env.GENERATION_SUCCESS == 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Set upload path
          S3_PATH="s3://${AWS_S3_BUCKET_NAME}/first-basemap/${OUTPUT_FILE}"
          echo "Uploading to: $S3_PATH"

          # Run upload of the output file
          METADATA="generation-date=$TIMESTAMP,github-run=${{ github.run_id }},zoom-levels=$MIN_ZOOM-$MAX_ZOOM,simplification-profile=${{ inputs.product }}"
          aws s3 cp "$OUTPUT_FILE" "$S3_PATH" \
            --storage-class INTELLIGENT_TIERING \
            --metadata "$METADATA" \
            --no-progress

          echo "✓ Upload complete!"
          echo "Tiles available at: $S3_PATH"

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - generate-tiles
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ env.GITHUB_OIDC_ROLE_ARN }}
          role-session-name: stop-ec2-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.4.0
        with:
          mode: stop
          github-token: ${{ secrets.RUNNER_MACHINE_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
